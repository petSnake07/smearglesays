<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Smeargle Says</title>
  <meta name="theme-color" content="#fffdf7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Smeargle Says">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body class="center-page home-page">
  <main class="home-card">
    <img src="logo.png" alt="Smeargle Says" class="logo">
    <p class="tagline">The Pokémon drawing app<br>Gotta sketch 'em all!</p>
    <a class="big-button play-button image-play-button" href="login.html">
    <img src="play.png" alt="Play">
</a>

    <aside class="daily-card daily-home-card" aria-live="polite">
      <span class="daily-kicker">Daily Challenge</span>
      <img id="dailyHomeImage" class="daily-image" alt="Today's daily Pokémon">
      <strong id="dailyHomeName">Loading...</strong>
      <button id="dailyHomeBtn" class="small-button daily-play-button" type="button">PLAY</button>
    </aside>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
